spring.application.name=pedidos-api

# Banco de dados (valores padrão para rodar local; em produção vêm de variáveis de ambiente)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pedidos}
spring.datasource.username=${DB_USER:pedidos}
spring.datasource.password=${DB_PASSWORD:pedidos}

# O Flyway cria as tabelas; o Hibernate só confere se as entidades batem com o banco
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Health check para Docker e Kubernetes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Integração com o ViaCEP
viacep.url=https://viacep.com.br/ws
