services:
  postgres:
    image: postgres:17-alpine
    container_name: pedidos-postgres
    environment:
      POSTGRES_DB: pedidos
      POSTGRES_USER: pedidos
      POSTGRES_PASSWORD: pedidos
    ports:
      - "5432:5432"
    volumes:
      - pedidos-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedidos -d pedidos"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: pedidos-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pedidos
      DB_USER: pedidos
      DB_PASSWORD: pedidos
    ports:
      - "8080:8080"

  sonarqube:
    image: sonarqube:community
    container_name: pedidos-sonarqube
    profiles: ["qualidade"]
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions

volumes:
  pedidos-data:
  sonarqube-data:
  sonarqube-extensions:
